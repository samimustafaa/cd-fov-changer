name: Windows Release
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'updater.py'
      - 'game_detector.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: python -m pip install --upgrade pyinstaller psutil
      - name: Build onedir executable
        run: pyinstaller --noconfirm --clean --onedir --windowed --name sg0hann-FOV-Changer app.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/sg0hann-FOV-Changer/sg0hann-FOV-Changer.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Application exited unexpectedly: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/sg0hann-FOV-Changer" -DestinationPath "sg0hann-FOV-Changer-win64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "sg0hann-FOV-Changer-win64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash *sg0hann-FOV-Changer-win64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish release for app version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path updater.py -Pattern '^VERSION = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Missing VERSION in updater.py" }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists. Increment VERSION for a new update."
            exit 0
          }
          gh release create $tag "sg0hann-FOV-Changer-win64.zip" "SHA256SUMS.txt" --target "${{ github.sha }}" --title "sg0hann FOV Changer $tag (Prototype)" --notes "Portable Windows folder build. Extract the whole ZIP, launch sg0hann-FOV-Changer.exe. One-time migration from v0.2.0 required. Future updates supported in-app. Camera FOV control remains unverified."
